services:
  app:
    build: .

  db:
    build: db/.
    restart: always
    ports:
      - "33060:3306"

  world:
    build:
      context: ./db
      dockerfile: world.Dockerfile
    restart: always
    ports:
      - "33061:3306"

  population:
    build:
      context: .
      dockerfile: population.Dockerfile
    environment:
      DB_HOST: world
      DB_PORT: "3306"
    depends_on:
      - world
