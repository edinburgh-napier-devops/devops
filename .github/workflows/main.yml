name: Test HR Report
on: workflow_dispatch

jobs:
  build:
    name: Build and run HR module
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'adopt'

      - name: Build HR module
        run: mvn -pl hr -am package

      - name: Start employees database
        run: docker compose up --build -d db

      - name: Run HR reports
        run: java -jar hr/target/*-jar-with-dependencies.jar
        env:
          DB_HOST: localhost
          DB_PORT: "33060"

      - name: Stop database
        if: always()
        run: docker compose down